name: storybook

# このリポジトリのブランチの Storybook（設定ファイル review-canvas.config.json のもの）を、このリポジトリのスタックへ置く・消す（docs/deploy.md「ブランチの Storybook をワークフローから置く」）。
# 使う側に出している再利用ワークフロー publish.yml を、同じコミットのまま呼ぶ（置く手順も push したコミットの版。#41 の b1）。
# - push: 置いていないブランチも置く（Storybook に関わるパスが変わったとき。#41 の a1）。画像だけのブランチ issue-images は、設定ファイルが無いので外す
# - ブランチを消した（delete）: 消す
# - workflow_dispatch: 1 つのブランチ・置いてあるブランチの全部を置き直す
# リポジトリの変数 REVIEW_CANVAS_PUBLISH_ENABLED が true のときだけ動く（フォーク・写したリポジトリでは、AWS につながずに飛ばす）。
# 公開リポジトリの記録にアカウント ID を出さないよう、ロールの ARN はリポジトリの Secret から渡す。

on:
  push:
    branches-ignore: [issue-images]
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: 置くブランチ（空なら、このワークフローを動かしたブランチ）
        required: false
        type: string
      all:
        description: いま置いてあるブランチを全部置き直す
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      review_canvas_ref: ${{ github.sha }}
      review_canvas_repository: ${{ github.repository }}
      config: review-canvas.config.json
      roles_from_secrets: ${{ vars.REVIEW_CANVAS_PUBLISH_ENABLED == 'true' }}
      publish_unpublished_on_push: true
      aws_region: ${{ vars.REVIEW_CANVAS_AWS_REGION || 'ap-northeast-1' }}
      stack_name: ${{ vars.REVIEW_CANVAS_STACK_NAME || 'ReviewCanvas' }}
      default_branch: ${{ vars.REVIEW_CANVAS_DEFAULT_BRANCH }}
      branch: ${{ inputs.branch || '' }}
      all: ${{ inputs.all || false }}
    secrets:
      aws_role_arn: ${{ secrets.REVIEW_CANVAS_PUBLISH_ROLE_ARN }}
      aws_main_role_arn: ${{ secrets.REVIEW_CANVAS_PUBLISH_MAIN_ROLE_ARN }}
