name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR・ブランチに続けて push したら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Action はコミットの SHA で固定する（publish.yml と同じ）
jobs:
  # コミットメッセージの決まり（1 行・AI の署名なし）。手元の lefthook と同じスクリプトを、PR のコミットの範囲にかける
  # （マージコミットは見ない。git revert の決まった本文は認める。docs/development.md「コミット」）
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-message.mjs --range "${BASE_SHA}..${HEAD_SHA}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # validate は prevalidate で codegen（openapi.json → src/generated）を済ませる。画面の型は毎回 openapi.json から作るので、
      # API の形と画面のずれは tsc が、openapi.json と API のコードのずれは openapi:check が見つける。
      # eslint（層・境界・命名・自前のルール）・tsc・knip・cspell・prettier・設定の JSON Schema をまとめて確かめる
      - name: Validate
        run: |
          pnpm run validate
          pnpm run openapi:check
          pnpm run infra:validate
          pnpm --dir examples/sample-storybook run validate

      # CLI の入口が Node で読み込めて、使い方を出せることを確かめる（コマンドは動かさず、AWS にもつながない）
      - name: CLI
        run: node bin/review-canvas.mjs --help

      # MCP サーバーが、シンボリックリンク越し（node_modules/.bin と同じ形）に起こしても ping に答えることを確かめる（API にはつながない）
      - name: MCP server
        run: |
          set -euo pipefail
          ln -s "$PWD/bin/review-canvas-mcp.mjs" "$RUNNER_TEMP/review-canvas-mcp"
          answer="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"ping"}' | node "$RUNNER_TEMP/review-canvas-mcp")"
          test "$answer" = '{"jsonrpc":"2.0","id":1,"result":{}}'

  # ワークフローの書き方と run のシェルを確かめる（shellcheck はランナーに入っているものを使う）
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 取ってきたものは、リリースの checksums と同じハッシュのときだけ使う
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      # shellcheck が無いと actionlint は run のシェルを確かめずに通るため、先に有無を確かめる
      - name: Actionlint
        run: |
          if ! command -v shellcheck >/dev/null; then
            echo "::error::shellcheck がありません（actionlint が run のシェルを確かめられない）"
            exit 1
          fi
          "$RUNNER_TEMP/actionlint" -color

  build:
    runs-on: ubuntu-latest
    # Screenshots（12 分）と Check app Storybook（8 分）に、組み立ての分を足す
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Storybook の iframe.html に差し込む橋渡し（置くスクリプト・手元のサーバーが読む）を、1 つのファイルにビルドできることを確かめる
      - name: Build bridge
        run: |
          pnpm run build:bridge
          test -s dist-bridge/review-canvas-bridge.js

      # デプロイ先のビルドに、擬似ログイン（署名の無いトークンを作る）・ストーリー用の偽のログイン・MSW・ストーリーのコードが入っていないことを確かめる
      - name: Build for deploy
        run: |
          pnpm run build:deployed
          pnpm run check:deployed-bundle

      # サンプルのショップと、review-canvas 自身の画面の Storybook（設定の storybooks の 2 つ）を組み立てる。
      # 自身の画面の Storybook には、動く画面で開くサンプルのショップを写す（先にサンプルを組み立てる。scripts/stage-story-storybooks.mjs）
      - name: Build Storybooks
        run: |
          pnpm run build:storybook
          test -s examples/sample-storybook/storybook-static/index.json
          test -s storybook-static/index.json
          grep -q review-canvas-bridge storybook-static/review-canvas-story/main/shop/iframe.html

      # 置くときと同じ手順で、設定の Storybook（サンプルのショップ・review-canvas 自身）の全ストーリーを撮れることを確かめる（設定の幅ごとに 1 枚ずつ）。
      # 撮影のスクリプトは 10 分（CAPTURE_TIME_LIMIT_MS）で打ち切るので、step の上限はブラウザを入れる分だけ長くする
      - name: Screenshots
        timeout-minutes: 12
        run: |
          pnpm --dir infra exec playwright install --with-deps --only-shell chromium
          pnpm --dir infra run screenshots
          jq -r '.storybooks[] | "\(.outDir) \(.widths | unique | length)"' review-canvas.config.json |
            while read -r out widths; do
              stories="$(jq '[.entries[] | select(.type == "story")] | length' "$out/index.json")"
              shots="$(jq '.shots | length' "$out/review-canvas-shots.json")"
              if [ "$shots" -ne $((stories * widths)) ]; then
                echo "::error::$out のスクリーンショットが足りません（$shots 枚。ストーリー $stories × 幅 $widths のはず）"
                exit 1
              fi
              # ブラウザへ文字列で渡す読み取り（中身の高さ・主な要素）が、ビルドした形でも動いている
              measured="$(jq '[.shots[] | select((.contentHeight | type) == "number" and (.elements | type) == "array")] | length' "$out/review-canvas-shots.json")"
              if [ "$measured" -ne "$shots" ]; then
                echo "::error::$out に、中身の高さ・主な要素を読めていないスクリーンショットがあります（$measured / $shots 枚）"
                exit 1
              fi
            done

      # review-canvas 自身の画面の Storybook: 決めた状態のストーリーがそろい、どれも play 関数まで通り、
      # Storybook の外・MSW に無い道へ通信しないことを確かめる（Chromium は上の Screenshots で入れたもの）
      # 上限は、スクリプト全体の締め切り（6 分。CHECK_TIME_LIMIT_MS）と、最後の 1 本の上限（開くのと描くのを 30 秒ずつ待つ）に、ブラウザを立ち上げる分を足したもの
      - name: Check app Storybook
        timeout-minutes: 8
        run: pnpm run check:storybook:app

      # CDK アプリを組み立てる（Lambda のバンドルを含む）。値は架空のもので、AWS にはつながない
      - name: Synth
        env:
          REVIEW_CANVAS_AUTH0_DOMAIN: tenant.example.com
          REVIEW_CANVAS_AUTH0_CLIENT_ID: dummy-client-id
          REVIEW_CANVAS_AUTH0_AUDIENCE: https://review-canvas.example.com/api
          REVIEW_CANVAS_GITHUB_OIDC_PROVIDER: create
          REVIEW_CANVAS_GITHUB_OIDC_SUB_PREFIX: repo:example/app
          # 手元の esbuild でバンドルできないときに Docker へ逃げず、その場で落とす
          CDK_DOCKER: "false"
        run: pnpm run synth --quiet

      # 使う側の CDK アプリに ReviewCanvas を組み込んだ形も組み立てる（infra の外から、pnpm を介さずに動かす）
      - name: Synth embedded
        env:
          REVIEW_CANVAS_AUTH0_DOMAIN: tenant.example.com
          REVIEW_CANVAS_AUTH0_CLIENT_ID: dummy-client-id
          REVIEW_CANVAS_AUTH0_AUDIENCE: https://review-canvas.example.com/api
          REVIEW_CANVAS_GITHUB_OIDC_PROVIDER: create
          REVIEW_CANVAS_GITHUB_OIDC_SUB_PREFIX: repo:example/app
          # 手元の esbuild でバンドルできないときに Docker へ逃げず、その場で落とす
          CDK_DOCKER: "false"
        working-directory: ${{ runner.temp }}
        run: |
          node -r "$GITHUB_WORKSPACE/infra/node_modules/esbuild-register" "$GITHUB_WORKSPACE/infra/test/embedded-app.ts" embedded.out
          test -s embedded.out/ToolsStack.template.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # medium のテストが DynamoDB Local を使う
      - name: Start DynamoDB Local
        run: pnpm run docker:up

      # 層ごとのカバレッジの下限（vitest.config.ts の thresholds）も確かめる
      - name: Test
        run: |
          pnpm run test:coverage --silent
          pnpm run infra:test --silent

  # 雛形（pnpm run new:api）で作った直後の状態が、検査とテストを通ることを確かめる（雛形が決まりからずれたら落ちる）
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold an endpoint
        run: |
          pnpm run new:api get comment/scaffold-check scaffold-check
          pnpm run new:api post meta/scaffold-check-meta scaffold-check-meta
          # パスのパラメータ（認証の経路は :名前 の書き方になる）と、パラメータのルートに隠れる固定のパス（前に登録される）
          pnpm run new:api get meta/scaffold-check-source scaffold-check-source --path '/scaffold-sources/{sourceId}'
          pnpm run new:api get thread/thread-count count-threads --path /count

      - name: Validate and test the scaffolded code
        run: |
          pnpm run validate
          pnpm run test:small --silent
