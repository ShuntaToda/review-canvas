<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>サンプルのショップ（見本の画面）</title>
    <style>
      body { margin: 0; font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif; color: #1f2733; background: #f5f7fa; }
      main { width: 560px; margin: 32px auto; padding: 24px; background: #fff; border-radius: 12px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      label { display: block; font-size: 14px; margin: 14px 0 6px; }
      input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; border: 1px solid #c5ccd6; border-radius: 6px; }
      .error { display: none; margin-top: 6px; color: #c0261b; font-size: 13px; }
      .invalid input { border-color: #c0261b; }
      .invalid .error { display: block; }
      button { margin-top: 20px; padding: 10px 18px; font-size: 14px; border: 0; border-radius: 6px; background: #1d6fd6; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>注文フォーム</h1>
      <section id="delivery-section">
        <div id="delivery-date">
          <label for="date">お届け日</label>
          <input id="date" type="date" value="2026-01-20" />
          <p class="error">お届け日を選び直してください</p>
        </div>
        <div id="delivery-time">
          <label for="time">お届けの時間帯</label>
          <select id="time">
            <option>指定しない</option>
            <option>午前</option>
            <option>14〜16 時</option>
          </select>
        </div>
      </section>
      <button id="submit" type="button">注文を確かめる</button>
    </main>
    <script>
      document.querySelector("#submit").addEventListener("click", () => {
        document.querySelector("#delivery-date").classList.add("invalid");
      });
    </script>
  </body>
</html>
