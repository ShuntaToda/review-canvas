assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,tsx,css,json,jsonc,yml,yaml,md,mjs}"
      exclude:
        - "infra/**"
      run: pnpm exec prettier --cache --write --ignore-unknown {staged_files}
      stage_fixed: true
      skip: [merge, rebase]

    - name: prettier-infra
      root: infra/
      glob:
        - "*.{ts,json,md}"
        - "lib/cloudfront-functions/*.js"
      run: pnpm exec prettier --cache --write {staged_files}
      stage_fixed: true
      skip: [merge, rebase]

    - name: eslint
      glob:
        - "*.{ts,tsx}"
        - "bin/*.mjs"
        - "eslint-rules/**/*.mjs"
        - "scripts/*.mjs"
        - ".claude/hooks/*.mjs"
      exclude:
        - "infra/**"
        - "examples/**"
      run: pnpm exec eslint --cache --max-warnings 0 --no-warn-ignored --fix {staged_files}
      stage_fixed: true
      skip: [merge, rebase]
      fail_text: "lint の決まりに合っていません。メッセージのとおりにコードを直してください（eslint-disable で黙らせない。型が解決できないという誤りばかりなら、先に pnpm run codegen）"

    - name: eslint-infra
      root: infra/
      glob: "*.ts"
      run: pnpm exec eslint --cache --max-warnings 0 --no-warn-ignored --fix {staged_files}
      stage_fixed: true
      skip: [merge, rebase]

commit-msg:
  jobs:
    # メッセージは 1 行で、AI の署名の行（Co-Authored-By: のうち AI のもの・セッションの URL）を入れない。
    # CI も PR のコミットに同じスクリプトをかける（--no-verify や GitHub の画面で作ったコミットも見る）
    - name: commit-message
      run: node scripts/check-commit-message.mjs {1}

pre-push:
  parallel: true
  jobs:
    # 画面の型（src/generated）を openapi.json から作り直してから確かめる（古い生成物のまま通さない）
    - name: tsc
      glob: "*.{ts,tsx}"
      exclude:
        - "infra/**"
      run: pnpm run codegen && pnpm run validate:tsc

    - name: tsc-infra
      root: infra/
      glob: "*.ts"
      run: pnpm exec tsc --noEmit

    - name: openapi-check
      glob:
        - "api/*.ts"
        - "api/**/*.ts"
      run: pnpm run openapi:check
      fail_text: "openapi.json が API のコードと合っていません: pnpm run openapi:generate && pnpm run codegen で作り直し、コミットに入れてください"

    - name: cspell
      glob: "*.{ts,tsx,md,yml,yaml,json,mjs}"
      run: pnpm exec cspell --cache --gitignore --no-must-find-files {push_files}
      fail_text: "未知の単語であれば cspell.json の words に足してください"

    # つくりの決まり（ユースケースと DI・ルートと OpenAPI と認証・MCP が呼ぶ API）と、自前の lint ルール・雛形のテスト。数秒で終わる
    - name: structure
      glob:
        - "api/**/*.ts"
        - "bin/*.mjs"
        - "eslint-rules/**/*.mjs"
        - "scripts/*.mjs"
        - ".claude/hooks/*.mjs"
        - "openapi.json"
        # api/・src/ に .ts・.tsx 以外のコードを置いていないか（置くと lint が掛からない）
        - "{api,src}/**/*.{mts,cts,js,mjs,cjs,jsx}"
      run: pnpm run test:structure
      fail_text: "つくりの決まりに合っていません。落ちたテストの題に直し方があります（一覧は AGENTS.md「道具で縛っている決まり」）"

    - name: knip
      glob: "*.{ts,tsx,mjs,json}"
      run: pnpm run validate:knip
      fail_text: "使っていない export・ファイル・依存があります。消すか、使う側を書いてください"
